:root {
  --mat: #2a3b40; --mat-dot: #34494f; --mat-ink: #93a8ad;
  --rail: #d9d6ce; --rail-hi: #ebe9e3; --rail-lo: #bdb9af; --rail-edge: #a19d93;
  --ink: #1e2427; --ink-2: #5b6266; --probe: #f2c21b; --probe-deep: #b38b00;
  --paper: #f2f3f0; --grid: rgba(64, 104, 132, .11); --rule: #b9c2c8;
  --ok: #2f7d4f; --warn: #b4471f; --screen: #10171b;
  --ui: 'Barlow SC', 'Segoe UI', Arial, sans-serif; --ar: 'Plex Arabic', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; }
body { font-family: var(--ui); color: var(--ink); background-color: var(--mat); background-image: radial-gradient(var(--mat-dot) 1.1px, transparent 1.4px); background-size: 15px 15px; }
html[lang="ar"] body, [dir="rtl"] .ar-able { font-family: var(--ar), var(--ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--probe); outline-offset: 2px; }

/* ---------- top rail: reads like the front strip of an instrument ---------- */
#rail { position: fixed; inset: 0 0 auto 0; height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: linear-gradient(var(--rail-hi), var(--rail) 40%, #d2cfc6); border-bottom: 1px solid var(--rail-edge); box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 2px 6px rgba(0,0,0,.25); z-index: 10; }
.brand { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
.brand .name { font-weight: 700; font-size: 18px; letter-spacing: .1px; }
.brand .sub { font-size: 14px; color: var(--ink-2); }
.brand .beta { align-self: center; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .3px; color: #6a4b00; background: #fff6d6; border: 1px solid #ecd27a; border-radius: 4px; padding: 1px 6px; cursor: pointer; }
.brand .beta:hover { background: #ffefb3; }
.brand .beta:focus-visible { outline: 2px solid var(--probe-deep); outline-offset: 2px; }
.grow { flex: 1; }
.key { height: 32px; padding: 0 13px; border: 1px solid var(--rail-edge); border-radius: 4px; background: linear-gradient(#f7f6f2, #dedbd3); font-size: 14.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  box-shadow: 0 1px 0 #fff inset, 0 1px 1px rgba(0,0,0,.15); }
.key:hover { background: linear-gradient(#fff, #e6e3dc); }
.key:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,.2) inset; }
.key svg { width: 16px; height: 16px; flex: none; }
.tray { display: inline-flex; padding: 3px; gap: 3px; background: var(--rail-lo); border-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.25) inset; }
.tray .key { height: 28px; border-color: #a7a399; box-shadow: none; }
.key .lamp { width: 9px; height: 4px; border-radius: 1px; background: #8e8a80; }
.key.on .lamp { background: var(--probe); box-shadow: 0 0 6px var(--probe); }
.key.on { background: linear-gradient(#fffdf3, #ebe6d3); }
.toggle { gap: 9px; padding-inline-end: 10px; }
.toggle .track { width: 34px; height: 18px; border-radius: 9px; background: var(--rail-lo); box-shadow: 0 1px 2px rgba(0,0,0,.35) inset; position: relative; flex: none; transition: background .15s; }
.toggle .thumb { position: absolute; top: 2px; inset-inline-start: 2px; width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(#fff, #d9d6cf); box-shadow: 0 1px 2px rgba(0,0,0,.4); transition: inset-inline-start .15s; }
.toggle[aria-checked="true"] .track { background: var(--probe); box-shadow: 0 0 6px rgba(242,194,27,.6), 0 1px 2px rgba(0,0,0,.25) inset; }
.toggle[aria-checked="true"] .thumb { inset-inline-start: 18px; }
.toggle .state { min-width: 24px; font-size: 13px; color: var(--ink-2); text-align: start; }
@media (prefers-reduced-motion: reduce) { .toggle .track, .toggle .thumb { transition: none; } }
.leads { display: inline-flex; align-items: center; gap: 6px; } .leads .lbl { margin-inline-end: 4px; }
.leads .lbl { font-size: 13px; color: var(--ink-2); }
.plugsw { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 3px solid rgba(0,0,0,.35); padding: 0; position: relative; }
.plugsw::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: rgba(0,0,0,.3); }
.plugsw.sel { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- bench ---------- */
#bench { position: fixed; inset: 48px 0 0 0; width: 100%; height: calc(100% - 48px); direction: ltr; unicode-bidi: isolate; touch-action: none; cursor: default; }
#bench.panning { cursor: grabbing; }
.pt { font-family: 'Arial Narrow', 'Barlow SC', Arial, sans-serif; font-stretch: condensed; pointer-events: none; }
.knob, .slide, .dipk, .sbtn, .sknob, .hpjack, .bnc, .infoBtn { cursor: pointer; }
.sknob, .knob { cursor: grab; } .sknob:active, .knob:active { cursor: grabbing; }
.sock { cursor: crosshair; } .bncPlug { cursor: crosshair; }
.sock:hover .sockHit { fill: rgba(242,194,27,.35); }
#bench.dragging .sock:hover .sockHit { fill: rgba(242,194,27,.6); }
.lead { cursor: grab; } .lead:hover .leadOut { stroke: #fff; }
#bench.bending, #bench.bending .lead { cursor: grabbing; }
.ctx button.rs { border: 1px solid #9aa3a7; color: var(--ink); background: #fff; border-radius: 4px; padding: 3px 9px; cursor: pointer; font-size: 13.5px; }
/* one click highlights a lead: soft glow, its plugs ringed, every other lead dimmed */

@keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
@media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 820px) { html:not(.rotateOK) #rotate { display: flex; } }
.bugFallback { display: none; margin-top: 12px; padding: 10px 12px; border: 1px solid #e0b25c; background: #fff7e6; border-radius: 4px; font-size: 14px; line-height: 1.55; }
.bugFallback.show { display: block; }
.bugFallback a { color: #0f5a8a; font-weight: 600; word-break: break-all; }
.bugFallback .row2 { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.bugFallback button { height: 30px; padding: 0 12px; border: 1px solid #9aa3a7; background: #fff; border-radius: 4px; cursor: pointer; font-weight: 500; }
/* ---------- bug report ---------- */
.dlgWrap { position: fixed; inset: 0; background: rgba(16, 24, 28, .5); display: none; z-index: 32; }
.dlgWrap.open { display: grid; place-items: center; }
.dlg { width: min(520px, calc(100vw - 32px)); padding: 16px 22px 18px; user-select: text; }
.fl { display: block; font-size: 15px; font-weight: 600; margin: 10px 0 5px; }
.bugKind { margin: 4px 0 2px; } .bugKind button { padding: 6px 16px; font-size: 14.5px; }
.dlg textarea { width: 100%; resize: vertical; border: 1px solid #9aa3a7; border-radius: 4px; padding: 8px 10px; font: inherit; font-size: 15px; line-height: 1.5; color: var(--ink); background: #fff; }
.dlg textarea:focus-visible { outline: 2px solid var(--probe); outline-offset: 0; border-color: var(--ink); }
.dlg textarea[aria-invalid="true"] { border-color: var(--warn); }
.ferr { color: var(--warn); font-size: 13.5px; min-height: 1.2em; margin: 3px 0 0; }
.fchk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin: 12px 0 0; cursor: pointer; line-height: 1.45; }
.fchk input { margin-top: 3px; }
.send { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 0; border-radius: 4px; background: #18773f; color: #fff; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.send:hover { background: #126333; }
.send svg { width: 17px; height: 17px; }
@media (max-width: 760px) { .rbody { grid-template-columns: 1fr; } .rtoc { display: none; } .lrow { grid-template-columns: 1fr auto; } .lpart, .lgo { display: none; } }
@media (max-width: 1150px) { .leads .lbl, .brand .sub { display: none; } }

/* ---------- welcome guide ---------- */
#tour { position: fixed; inset: 0; z-index: 60; }
#tour .tourDim { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
#tour .tourHole { fill: rgba(8, 12, 16, .66); transition: d .32s cubic-bezier(.2,.8,.2,1); }
#tour .tourRing { position: fixed; border: 3px solid var(--probe); border-radius: 12px; pointer-events: none; transition: all .32s cubic-bezier(.2,.8,.2,1); animation: tourPulse 1.6s ease-in-out infinite; }
@keyframes tourPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,194,27,.55); } 50% { box-shadow: 0 0 0 9px rgba(242,194,27,0); } }
#tour .tourArrow { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: visible; }
#tour .tourLine[d=""] { display: none; }
#tour .tourLine { stroke-dasharray: 9 7; animation: tourDash 1s linear infinite; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
@keyframes tourDash { to { stroke-dashoffset: -16; } }
#tour .tourCard { position: fixed; padding: 16px 20px 14px; transition: left .32s cubic-bezier(.2,.8,.2,1), top .32s cubic-bezier(.2,.8,.2,1); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
#tour .tourCard h2 { font-size: 18px; margin: 4px 0 6px; }
#tour .tourCard p { font-size: 15px; line-height: 1.6; margin: 0 0 12px; }
html[lang="ar"] #tour .tourCard p { line-height: 1.85; }
#tour .tArt { display: block; width: 100%; height: auto; max-height: 130px; margin: 0 0 6px; }
#tour .tourFoot { display: flex; align-items: center; gap: 10px; }
#tour .tourDots { display: inline-flex; gap: 5px; margin-inline-end: auto; } #tour .tourDots i { width: 7px; height: 7px; border-radius: 50%; background: #c3c8ca; } #tour .tourDots i.on { background: var(--ink); width: 18px; border-radius: 4px; }
#tour .tourSkip { background: none; border: 0; color: var(--ink-2); font-size: 14px; cursor: pointer; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }
#tour .tourNav { display: inline-flex; gap: 8px; }
#tour .tourNav button { min-width: 84px; padding: 7px 14px; font-size: 14.5px; border-radius: 4px; border: 1px solid #9aa3a7; background: #fff; cursor: pointer; }
#tour .tourNav button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
#tour button:focus-visible { outline: 2px solid var(--probe); outline-offset: 2px; }
#tour .tWheel { animation: tWheel .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes tWheel { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
#tour .tUp { animation: tBob 1.2s ease-in-out infinite; } #tour .tDown { animation: tBob 1.2s ease-in-out infinite reverse; }
@keyframes tBob { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
#tour .tKey { animation: tPress 1.2s ease-in-out infinite; }
@keyframes tPress { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
#tour .tWave { animation: tBob 2s ease-in-out infinite; }
#tour.still *, #tour.still .tourCard { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { #tour * { animation: none !important; transition: none !important; } }
/* the welcome guide on short screens (after its own rules so these win) */
@media (max-height: 500px) {
  #tour .tourCard { max-height: calc(100vh - 16px); overflow-y: auto; overflow-x: hidden; padding: 10px 14px 10px; }
  #tour .tArt { max-height: 70px; } #tour .tourDots { display: none; } #tour .tourSkip { margin-inline-end: auto; } #tour .tourNav button { min-width: 64px; padding: 6px 10px; } #tour .tourCard h2 { font-size: 16px; margin: 2px 0 4px; } #tour .tourCard p { font-size: 13.5px; line-height: 1.5; margin-bottom: 8px; }
  html[lang="ar"] #tour .tourCard p { line-height: 1.65; }
}

<li><b>\u0644\u064A\u0633\u062A \u0646\u0633\u062E\u0629 \u0645\u0637\u0627\u0628\u0642\u0629 \u062A\u0645\u0627\u0645\u0627\u064B \u0644\u0644\u062C\u0647\u0627\u0632.</b> \u0627\u0644\u0628\u0631\u0646\u0627\u0645\u062C \u0645\u062D\u0627\u0643\u0627\u0629 \u0644\u062C\u0647\u0627\u0632 Emona ETT-101 \u0648\u0644\u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629\u060C \u0645\u0628\u0646\u064A\u0629 \u0639\u0644\u0649 \u0627\u0644\u0645\u0648\u0627\u0635\u0641\u0627\u062A \u0627\u0644\u0645\u0646\u0634\u0648\u0631\u0629 \u0648\u0643\u062A\u0628 \u0627\u0644\u0645\u0639\u0645\u0644\u060C \u0644\u0630\u0644\u0643 \u0642\u062F \u0644\u0627 \u062A\u0637\u0627\u0628\u0642 \u0627\u0644\u0642\u0631\u0627\u0621\u0627\u062A \u0627\u0644\u062C\u0647\u0627\u0632 \u0627\u0644\u062D\u0642\u064A\u0642\u064A \u0628\u0646\u0633\u0628\u0629 100%. \u0648\u0639\u0646\u062F \u0648\u062C\u0648\u062F \u0627\u062E\u062A\u0644\u0627\u0641\u060C \u064A\u0643\u0648\u0646 \u0627\u0644\u062C\u0647\u0627\u0632 \u0627\u0644\u062D\u0642\u064A\u0642\u064A \u0647\u0648 \u0627\u0644\u0645\u0631\u062C\u0639.</li>
<li><b>\u0644\u0644\u0637\u0644\u0627\u0628\u060C \u0645\u062C\u0627\u0646\u064A \u0648\u063A\u064A\u0631 \u0631\u0628\u062D\u064A.</b> \u0635\u064F\u0645\u0651\u0645 \u0627\u0644\u0628\u0631\u0646\u0627\u0645\u062C \u0644\u0645\u0633\u0627\u0639\u062F\u0629 \u0627\u0644\u0637\u0644\u0627\u0628 \u0639\u0644\u0649 \u0627\u0644\u062A\u062F\u0631\u0651\u0628 \u0648\u0627\u0644\u0627\u0633\u062A\u0639\u062F\u0627\u062F \u0644\u0645\u0639\u0645\u0644 \u0627\u0644\u0627\u062A\u0635\u0627\u0644\u0627\u062A. \u0648\u0644\u0627 \u064A\u062C\u0648\u0632 \u0628\u064A\u0639\u0647 \u0623\u0648 \u062A\u0623\u062C\u064A\u0631\u0647 \u0623\u0648 \u0648\u0636\u0639\u0647 \u0636\u0645\u0646 \u062F\u0648\u0631\u0629 \u0645\u062F\u0641\u0648\u0639\u0629 \u0623\u0648 \u0627\u0644\u062A\u0631\u0628\u062D \u0645\u0646\u0647 \u0628\u0623\u064A \u0634\u0643\u0644 \u0645\u0646 \u0627\u0644\u0623\u0634\u0643\u0627\u0644.</li>
<li><b>\u063A\u064A\u0631 \u062A\u0627\u0628\u0639 \u0644\u0634\u0631\u0643\u0629 Emona Instruments \u0623\u0648 UNI-T.</b> \u062A\u064F\u0633\u062A\u062E\u062F\u0645 \u0623\u0633\u0645\u0627\u0621 \u0627\u0644\u062C\u0647\u0627\u0632 \u0648\u0627\u0644\u0623\u062F\u0648\u0627\u062A \u0641\u0642\u0637 \u0644\u062A\u0648\u0636\u064A\u062D \u0645\u0627 \u064A\u062D\u0627\u0643\u064A\u0647 \u0627\u0644\u0628\u0631\u0646\u0627\u0645\u062C.</li>
<li>\u0625\u0630\u0627 \u0648\u062C\u062F\u062A \u0634\u064A\u0626\u0627\u064B \u0644\u0627 \u064A\u0637\u0627\u0628\u0642 \u0627\u0644\u062C\u0647\u0627\u0632\u060C \u0627\u0633\u062A\u062E\u062F\u0645 \u0632\u0631 <b>\u0627\u0644\u0625\u0628\u0644\u0627\u063A \u0639\u0646 \u0645\u0634\u0643\u0644\u0629</b> \u0644\u064A\u062A\u0645 \u0625\u0635\u0644\u0627\u062D\u0647.</li></ul>
<p class="fineprint" dir="ltr">Fonts: Barlow Semi Condensed (\xA9 The Barlow Project Authors) and IBM Plex Sans Arabic (\xA9 IBM Corp.), SIL Open Font License 1.1.</p>`},ko={en:{app:`<h3>Using the simulator</h3><ul>
<li><b>Patch a lead:</b> drag from one socket to another. Several leads can share a socket, just like the stackable leads.</li>
<li><b>Remove a lead:</b> double-click it. Right-click a lead to change its colour. <b>Right-click a socket</b> to connect it to CH1, CH2 or EXT TRIG, or to start a lead and click the other socket.</li>
<li><b>Knobs:</b> drag around the knob, sideways or up and down, or use the mouse wheel. Hold Shift for fine steps.</li>
<li><b>View:</b> Kit, Both and Scope fit that part to the screen. Ctrl + wheel zooms at the cursor; drag the empty bench to move around. Keys 1, 2, 3 switch views.</li>
<li><b>Headphones:</b> click the headphone socket on the BUFFER. Sound comes out of the computer speakers.</li>
<li><b>Guidance</b> (switch at the top) shows the <b>i</b> button on every module, socket names with a live reading, and knob values. Turn it off to practise like the real exam.</li>
<li><b>Undo / Redo:</b> the arrow buttons at the top (or Ctrl+Z and Ctrl+Y) take back a lead, a probe, a knob turn or a loaded experiment. The scope settings are not changed.</li>
<li><b>What is on this socket?</b> With Guidance on, a socket's tip names the signal from the way the kit is wired (for example AM signal, DSBSC signal, recovered message) and says what the module does with its inputs.</li>
<li><b>Check my wiring:</b> in a lab sheet, this button lists what is missing, a lead in the wrong place or an extra one, a probe on the wrong socket and two outputs joined together, and marks the wrong leads in red on the kit.</li>
<li><b>Share as a link</b> (Settings): makes a link with your leads, knobs and scope settings. Whoever opens it gets the same setup, on a phone or a computer. <b>Open a shared link</b> opens a link pasted from somewhere else.</li></ul>`,appTouch:`<h3>How to use it on a phone or tablet</h3><ul>
<li><b>Zoom:</b> pinch with two fingers, right where you want to look. Drag an empty part of the bench with one finger to move around. The centre button brings everything back.</li>
<li><b>Views:</b> Kit, Both and Scope fit that part to the screen. On a phone, Kit and Scope are the easiest.</li>
<li><b>Connect a lead:</b> zoom in, then drag from one socket to another (your finger only has to land near a socket). Or <b>hold a socket</b> for a moment: its menu sends it to <b>CH1, CH2 or EXT TRIG</b> on the scope, or starts a lead that you finish by tapping the other socket.</li>
<li><b>Remove a lead:</b> tap it twice. <b>Hold your finger on it</b> for its menu (colour, shape, remove).</li>
<li><b>Knobs:</b> drag around the knob to turn it. Scope keys and switches: tap them.</li>
<li><b>Headphones:</b> tap the headphone socket on the BUFFER; the sound comes out of the phone.</li>
<li><b>Turn the phone sideways:</b> the kit and the scope need a wide screen.</li>
<li><b>Undo / Redo:</b> the arrow buttons at the top take back a lead, a probe, a knob turn or a loaded experiment. The scope settings are not changed.</li>
<li><b>What is on this socket?</b> Hold a socket: the top of its menu names the signal from the way the kit is wired (for example AM signal, DSBSC signal, recovered message) and says what the module does with its inputs.</li>
<li><b>Check my wiring:</b> in a lab sheet, this button lists what is missing, a lead in the wrong place or an extra one, a probe on the wrong socket and two outputs joined together, and marks the wrong leads in red on the kit.</li>
<li><b>Share as a link</b> (Settings): makes a link with your leads, knobs and scope settings. Whoever opens it gets the same setup, on a phone or a computer. <b>Open a shared link</b> opens a link pasted from somewhere else.</li>
<li><b>Full screen:</b> on Android the page fills the screen (no address bar) after your first tap; swipe from the edge and tap Back to leave it, and the full-screen button in the toolbar brings it back. Settings \u2192 Full screen turns it on or off. On iPhone, add it to the home screen and open it from there.</li>
<li><b>Add it to your home screen</b> to open it like an app and use it without the internet: in Chrome, menu \u2192 Add to Home screen; on iPhone, Share \u2192 Add to Home Screen.</li></ul>`,scope:`<h3>The oscilloscope (UTD2102CEL style)</h3><ul>
<li><b>Connect:</b> drag from a BNC socket (CH1, CH2, EXT TRIG) to any socket on the kit. Double-click the lead to remove it.</li>
<li><b>CH1 / CH2:</b> the first press selects the channel and opens its menu; the shared VERTICAL knobs then control it. Press again while its menu is open to turn the channel off.</li>
<li><b>VERTICAL:</b> SCALE is volts/div and POSITION moves the trace.</li>
<li><b>HORIZONTAL:</b> SCALE is time/div (12 \xD7 8 divisions on screen); POSITION moves the trace sideways. <b>HORI MENU</b> has Main, Window (the screen splits: the main time base above with the expanded zone marked, the expanded waveform below) and Hold off (set with the MULTI PURPOSE knob).</li>
<li><b>TRIGGER:</b> LEVEL sets the trigger level. <b>TRIG MENU</b> sets source (CH1, CH2, EXT, AC Line), slope (Rise, Fall, Rise &amp; Fall), Auto/Normal/Single and coupling. <b>FORCE</b> makes one trigger.</li>
<li><b>SET TO ZERO:</b> puts the vertical and horizontal positions and the holdoff back to zero and the trigger level at 50 %.</li>
<li><b>MEASURE:</b> four zones (F1\u2013F4); press a zone to choose its channel, Volt or Time, and the parameter (Pk-Pk, RMS, Freq, Period\u2026). F5 shows all parameters of a channel.</li>
<li><b>CURSOR</b> gives Voltage, Time or Tracking cursors moved with MULTI PURPOSE (press the knob to switch A, B, A &amp; B). <b>MATH</b> gives +, \u2212, \xD7, \xF7 or FFT, <b>AUTO</b> sets everything up, <b>RUN/STOP</b> freezes the capture, <b>PrtSc</b> saves a picture of the screen.</li>
<li><b>UTILITY</b> (three pages): Self Cal, Help, Reset, Grid and the frequency counter (Cymometer).</li></ul>
<p>The lab manual is written for an analog scope: \u201CMode DUAL\u201D means CH1 and CH2 both on, \u201CTimebase\u201D is HORIZONTAL SCALE, \u201CVertical attenuation\u201D is VERTICAL SCALE and \u201CSweep magnification\u201D is HORI MENU \u2192 Window.</p>`},ar:{app:`<h3>\u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u0627\u0633\u062A\u062E\u062F\u0627\u0645</h3><ul>
<li><b>\u062A\u0648\u0635\u064A\u0644 \u0633\u0644\u0643:</b> \u0627\u0633\u062D\u0628 \u0645\u0646 \u0645\u0642\u0628\u0633 \u0625\u0644\u0649 \u0645\u0642\u0628\u0633 \u0622\u062E\u0631. \u064A\u0645\u0643\u0646 \u062A\u0648\u0635\u064A\u0644 \u0623\u0643\u062B\u0631 \u0645\u0646 \u0633\u0644\u0643 \u0628\u0627\u0644\u0645\u0642\u0628\u0633 \u0646\u0641\u0633\u0647\u060C \u0643\u0645\u0627 \u0641\u064A \u0627\u0644\u0623\u0633\u0644\u0627\u0643 \u0627\u0644\u062D\u0642\u064A\u0642\u064A\u0629.</li>
<li><b>\u0625\u0632\u0627\u0644\u0629 \u0633\u0644\u0643:</b> \u0627\u0646\u0642\u0631 \u0639\u0644\u064A\u0647 \u0645\u0631\u062A\u064A\u0646. \u0648\u0627\u0646\u0642\u0631 \u0628\u0627\u0644\u0632\u0631 \u0627\u0644\u0623\u064A\u0645\u0646 \u0644\u062A\u063A\u064A\u064A\u0631 \u0644\u0648\u0646\u0647. \u0648<b>\u0627\u0646\u0642\u0631 \u0628\u0627\u0644\u0632\u0631 \u0627\u0644\u0623\u064A\u0645\u0646 \u0639\u0644\u0649 \u0645\u0642\u0628\u0633</b> \u0644\u062A\u0648\u0635\u064A\u0644\u0647 \u0628\u0640 CH1 \u0623\u0648 CH2 \u0623\u0648 EXT TRIG\u060C \u0623\u0648 \u0644\u0628\u062F\u0621 \u0633\u0644\u0643 \u062B\u0645 \u0627\u0644\u0646\u0642\u0631 \u0639\u0644\u0649 \u0627\u0644\u0645\u0642\u0628\u0633 \u0627\u0644\u0622\u062E\u0631.</li>
<li><b>\u0627\u0644\u0645\u0642\u0627\u0628\u0636:</b> \u0623\u062F\u0650\u0631 \u062D\u0648\u0644 \u0627\u0644\u0645\u0642\u0628\u0636\u060C \u0623\u0648 \u0627\u0633\u062D\u0628 \u064A\u0645\u064A\u0646\u0627\u064B \u0648\u064A\u0633\u0627\u0631\u0627\u064B \u0623\u0648 \u0644\u0623\u0639\u0644\u0649 \u0648\u0644\u0623\u0633\u0641\u0644\u060C \u0623\u0648 \u0627\u0633\u062A\u062E\u062F\u0645 \u0639\u062C\u0644\u0629 \u0627\u0644\u0641\u0623\u0631\u0629. \u0627\u0636\u063A\u0637 Shift \u0644\u0644\u062D\u0631\u0643\u0629 \u0627\u0644\u062F\u0642\u064A\u0642\u0629.</li>
<li><b>\u0627\u0644\u0639\u0631\u0636:</b> \u0627\u0644\u0623\u0632\u0631\u0627\u0631 Kit \u0648 Both \u0648 Scope \u062A\u064F\u0643\u0628\u0651\u0631 \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0645\u0637\u0644\u0648\u0628 \u0639\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629. Ctrl \u0645\u0639 \u0639\u062C\u0644\u0629 \u0627\u0644\u0641\u0623\u0631\u0629 \u0644\u0644\u062A\u0643\u0628\u064A\u0631 \u0639\u0646\u062F \u0627\u0644\u0645\u0624\u0634\u0631\u060C \u0648\u0627\u0633\u062D\u0628 \u0641\u064A \u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0641\u0627\u0631\u063A\u0629 \u0644\u0644\u062A\u062D\u0631\u0651\u0643. \u0627\u0644\u0645\u0641\u0627\u062A\u064A\u062D 1 \u0648 2 \u0648 3 \u062A\u0628\u062F\u0651\u0644 \u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u0639\u0631\u0636.</li>
<li><b>\u0627\u0644\u0633\u0645\u0627\u0639\u0629:</b> \u0627\u0646\u0642\u0631 \u0639\u0644\u0649 \u0645\u0642\u0628\u0633 \u0627\u0644\u0633\u0645\u0627\u0639\u0629 \u0641\u064A BUFFER\u060C \u0648\u064A\u062E\u0631\u062C \u0627\u0644\u0635\u0648\u062A \u0645\u0646 \u0633\u0645\u0627\u0639\u0627\u062A \u0627\u0644\u062D\u0627\u0633\u0648\u0628.</li>
<li><b>\u0627\u0644\u0625\u0631\u0634\u0627\u062F\u0627\u062A</b> (\u0627\u0644\u0645\u0641\u062A\u0627\u062D \u0641\u064A \u0627\u0644\u0623\u0639\u0644\u0649) \u062A\u064F\u0638\u0647\u0631 \u0632\u0631 <b>i</b> \u0639\u0644\u0649 \u0643\u0644 \u0648\u062D\u062F\u0629\u060C \u0648\u0623\u0633\u0645\u0627\u0621 \u0627\u0644\u0645\u0642\u0627\u0628\u0633 \u0645\u0639 \u0642\u0631\u0627\u0621\u0627\u062A\u0647\u0627 \u0627\u0644\u0644\u062D\u0638\u064A\u0629\u060C \u0648\u0642\u064A\u0645 \u0627\u0644\u0645\u0642\u0627\u0628\u0636. \u0623\u0648\u0642\u0641\u0647\u0627 \u0644\u062A\u062A\u062F\u0631\u0651\u0628 \u0643\u0645\u0627 \u0641\u064A \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646.</li>
<li><b>\u062A\u0631\u0627\u062C\u0639 \u0648\u0625\u0639\u0627\u062F\u0629:</b> \u0632\u0631\u0627 \u0627\u0644\u0623\u0633\u0647\u0645 \u0641\u064A \u0627\u0644\u0623\u0639\u0644\u0649 (\u0623\u0648 Ctrl+Z \u0648 Ctrl+Y) \u064A\u0644\u063A\u064A\u0627\u0646 \u0622\u062E\u0631 \u0633\u0644\u0643 \u0623\u0648 \u0645\u062C\u0633\u0651 \u0623\u0648 \u062A\u062F\u0648\u064A\u0631 \u0644\u0645\u0642\u0628\u0636 \u0623\u0648 \u062A\u062C\u0631\u0628\u0629 \u062A\u0645 \u062A\u062D\u0645\u064A\u0644\u0647\u0627. \u0648\u0644\u0627 \u064A\u062A\u063A\u064A\u0651\u0631 \u0636\u0628\u0637 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629.</li>
<li><b>\u0645\u0627 \u0627\u0644\u0630\u064A \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0645\u0642\u0628\u0633\u061F</b> \u0645\u0639 \u062A\u0634\u063A\u064A\u0644 \u0627\u0644\u0625\u0631\u0634\u0627\u062F\u0627\u062A \u064A\u0630\u0643\u0631 \u062A\u0644\u0645\u064A\u062D \u0627\u0644\u0645\u0642\u0628\u0633 \u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u062D\u0633\u0628 \u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u062A\u0648\u0635\u064A\u0644 (\u0645\u062B\u0644 \u0625\u0634\u0627\u0631\u0629 AM \u0623\u0648 \u0625\u0634\u0627\u0631\u0629 DSBSC \u0623\u0648 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0627\u0644\u0645\u0633\u062A\u0631\u062C\u0639\u0629)\u060C \u0648\u0645\u0627 \u0627\u0644\u0630\u064A \u062A\u0641\u0639\u0644\u0647 \u0627\u0644\u0648\u062D\u062F\u0629 \u0628\u0645\u062F\u062E\u0644\u0627\u062A\u0647\u0627.</li>
<li><b>\u0627\u0641\u062D\u0635 \u062A\u0648\u0635\u064A\u0644\u064A:</b> \u0641\u064A \u0648\u0631\u0642\u0629 \u0627\u0644\u062A\u062C\u0631\u0628\u0629 \u064A\u0639\u0631\u0636 \u0647\u0630\u0627 \u0627\u0644\u0632\u0631 \u0645\u0627 \u064A\u0646\u0642\u0635\u060C \u0648\u0627\u0644\u0633\u0644\u0643 \u0627\u0644\u0645\u0648\u0635\u0651\u0644 \u0641\u064A \u0645\u0643\u0627\u0646 \u062E\u0637\u0623 \u0623\u0648 \u0627\u0644\u0632\u0627\u0626\u062F\u060C \u0648\u0627\u0644\u0645\u062C\u0633\u0651 \u0639\u0644\u0649 \u0645\u0642\u0628\u0633 \u062E\u0637\u0623\u060C \u0648\u0627\u0644\u0645\u062E\u0631\u062C\u064A\u0646 \u0627\u0644\u0645\u0648\u0635\u0651\u0644\u064A\u0646 \u0645\u0639\u0627\u064B\u060C \u0648\u064A\u064F\u0638\u0647\u0631 \u0627\u0644\u0623\u0633\u0644\u0627\u0643 \u0627\u0644\u062E\u0637\u0623 \u0628\u0627\u0644\u0644\u0648\u0646 \u0627\u0644\u0623\u062D\u0645\u0631 \u0639\u0644\u0649 \u0627\u0644\u062C\u0647\u0627\u0632.</li>
<li><b>\u0645\u0634\u0627\u0631\u0643\u0629 \u0643\u0631\u0627\u0628\u0637</b> (\u0645\u0646 \u0627\u0644\u0625\u0639\u062F\u0627\u062F\u0627\u062A): \u064A\u0635\u0646\u0639 \u0631\u0627\u0628\u0637\u0627\u064B \u0641\u064A\u0647 \u0623\u0633\u0644\u0627\u0643\u0643 \u0648\u0627\u0644\u0645\u0642\u0627\u0628\u0636 \u0648\u0636\u0628\u0637 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629. \u0648\u0645\u0646 \u064A\u0641\u062A\u062D\u0647 \u064A\u062D\u0635\u0644 \u0639\u0644\u0649 \u0646\u0641\u0633 \u0627\u0644\u062A\u0648\u0635\u064A\u0644\u0627\u062A \u0639\u0644\u0649 \u0627\u0644\u0647\u0627\u062A\u0641 \u0623\u0648 \u0627\u0644\u0643\u0645\u0628\u064A\u0648\u062A\u0631. \u0648<b>\u0641\u062A\u062D \u0631\u0627\u0628\u0637 \u0645\u064F\u0634\u0627\u0631\u064E\u0643</b> \u064A\u0641\u062A\u062D \u0631\u0627\u0628\u0637\u0627\u064B \u0645\u0646\u0633\u0648\u062E\u0627\u064B \u0645\u0646 \u0645\u0643\u0627\u0646 \u0622\u062E\u0631.</li></ul>`,appTouch:`<h3>\u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0639\u0644\u0649 \u0627\u0644\u0647\u0627\u062A\u0641 \u0623\u0648 \u0627\u0644\u062A\u0627\u0628\u0644\u062A</h3><ul>
<li><b>\u0627\u0644\u062A\u0643\u0628\u064A\u0631:</b> \u0628\u0627\u0639\u0650\u062F \u0628\u064A\u0646 \u0625\u0635\u0628\u0639\u064A\u0646 \u0623\u0648 \u0642\u0631\u0651\u0628\u0647\u0645\u0627 \u0639\u0646\u062F \u0627\u0644\u0645\u0643\u0627\u0646 \u0627\u0644\u0630\u064A \u062A\u0631\u064A\u062F \u0631\u0624\u064A\u062A\u0647. \u0648\u0627\u0633\u062D\u0628 \u0628\u0625\u0635\u0628\u0639 \u0648\u0627\u062D\u062F\u0629 \u0641\u064A \u0645\u0643\u0627\u0646 \u0641\u0627\u0631\u063A \u0644\u062A\u062A\u062D\u0631\u0643 \u0641\u064A \u0627\u0644\u0645\u0633\u0627\u062D\u0629. \u0648\u0632\u0631 \u0627\u0644\u062A\u0648\u0633\u064A\u0637 \u064A\u0639\u064A\u062F \u0643\u0644 \u0634\u064A\u0621 \u0625\u0644\u0649 \u0645\u0643\u0627\u0646\u0647.</li>
<li><b>\u0637\u0631\u0642 \u0627\u0644\u0639\u0631\u0636:</b> \u0627\u0644\u062C\u0647\u0627\u0632 \u0648\u0643\u0644\u0627\u0647\u0645\u0627 \u0648\u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u062A\u062C\u0639\u0644 \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0645\u0637\u0644\u0648\u0628 \u064A\u0645\u0644\u0623 \u0627\u0644\u0634\u0627\u0634\u0629. \u0648\u0639\u0644\u0649 \u0627\u0644\u0647\u0627\u062A\u0641 \u064A\u0643\u0648\u0646 \u0639\u0631\u0636 \u0627\u0644\u062C\u0647\u0627\u0632 \u0648\u062D\u062F\u0647 \u0623\u0648 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0648\u062D\u062F\u0647 \u0627\u0644\u0623\u0633\u0647\u0644.</li>
<li><b>\u062A\u0648\u0635\u064A\u0644 \u0633\u0644\u0643:</b> \u0643\u0628\u0651\u0631 \u0623\u0648\u0644\u0627\u064B\u060C \u062B\u0645 \u0627\u0633\u062D\u0628 \u0645\u0646 \u0645\u0642\u0628\u0633 \u0625\u0644\u0649 \u0645\u0642\u0628\u0633 \u0622\u062E\u0631 (\u064A\u0643\u0641\u064A \u0623\u0646 \u062A\u0636\u0639 \u0625\u0635\u0628\u0639\u0643 \u0642\u0631\u0628 \u0627\u0644\u0645\u0642\u0628\u0633). \u0623\u0648 <b>\u0627\u0636\u063A\u0637 \u0645\u0637\u0648\u0651\u0644\u0627\u064B \u0639\u0644\u0649 \u0645\u0642\u0628\u0633</b>: \u062A\u0638\u0647\u0631 \u0642\u0627\u0626\u0645\u0629 \u0644\u062A\u0648\u0635\u064A\u0644\u0647 \u0628\u0640 <b>CH1 \u0623\u0648 CH2 \u0623\u0648 EXT TRIG</b> \u0641\u064A \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629\u060C \u0623\u0648 \u0644\u0628\u062F\u0621 \u0633\u0644\u0643 \u062A\u0643\u0645\u0644\u0647 \u0628\u0627\u0644\u0636\u063A\u0637 \u0639\u0644\u0649 \u0627\u0644\u0645\u0642\u0628\u0633 \u0627\u0644\u0622\u062E\u0631.</li>
<li><b>\u0625\u0632\u0627\u0644\u0629 \u0633\u0644\u0643:</b> \u0627\u0636\u063A\u0637 \u0639\u0644\u064A\u0647 \u0645\u0631\u062A\u064A\u0646. \u0648<b>\u0627\u0636\u063A\u0637 \u0639\u0644\u064A\u0647 \u0645\u0637\u0648\u0651\u0644\u0627\u064B</b> \u0644\u062A\u0638\u0647\u0631 \u0642\u0627\u0626\u0645\u062A\u0647 (\u0627\u0644\u0644\u0648\u0646 \u0648\u0627\u0644\u0634\u0643\u0644 \u0648\u0627\u0644\u0625\u0632\u0627\u0644\u0629).</li>
<li><b>\u0627\u0644\u0645\u0642\u0627\u0628\u0636:</b> \u0627\u0633\u062D\u0628 \u062D\u0648\u0644 \u0627\u0644\u0645\u0642\u0628\u0636 \u0644\u062A\u062F\u064A\u0631\u0647. \u0648\u0623\u0632\u0631\u0627\u0631 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0648\u0627\u0644\u0645\u0641\u0627\u062A\u064A\u062D: \u0627\u0636\u063A\u0637 \u0639\u0644\u064A\u0647\u0627.</li>
<li><b>\u0627\u0644\u0633\u0645\u0627\u0639\u0629:</b> \u0627\u0636\u063A\u0637 \u0639\u0644\u0649 \u0645\u0642\u0628\u0633 \u0627\u0644\u0633\u0645\u0627\u0639\u0629 \u0641\u064A BUFFER\u060C \u0648\u064A\u062E\u0631\u062C \u0627\u0644\u0635\u0648\u062A \u0645\u0646 \u0627\u0644\u0647\u0627\u062A\u0641.</li>
<li><b>\u0623\u062F\u0650\u0631 \u0627\u0644\u0647\u0627\u062A\u0641 \u0628\u0627\u0644\u0639\u0631\u0636:</b> \u064A\u062D\u062A\u0627\u062C \u0627\u0644\u062C\u0647\u0627\u0632 \u0648\u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0625\u0644\u0649 \u0634\u0627\u0634\u0629 \u0639\u0631\u064A\u0636\u0629.</li>
<li><b>\u062A\u0631\u0627\u062C\u0639 \u0648\u0625\u0639\u0627\u062F\u0629:</b> \u0632\u0631\u0627 \u0627\u0644\u0623\u0633\u0647\u0645 \u0641\u064A \u0627\u0644\u0623\u0639\u0644\u0649 \u064A\u0644\u063A\u064A\u0627\u0646 \u0622\u062E\u0631 \u0633\u0644\u0643 \u0623\u0648 \u0645\u062C\u0633\u0651 \u0623\u0648 \u062A\u062F\u0648\u064A\u0631 \u0644\u0645\u0642\u0628\u0636 \u0623\u0648 \u062A\u062C\u0631\u0628\u0629 \u062A\u0645 \u062A\u062D\u0645\u064A\u0644\u0647\u0627. \u0648\u0644\u0627 \u064A\u062A\u063A\u064A\u0651\u0631 \u0636\u0628\u0637 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629.</li>
<li><b>\u0645\u0627 \u0627\u0644\u0630\u064A \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0645\u0642\u0628\u0633\u061F</b> \u0639\u0646\u062F \u0627\u0644\u0636\u063A\u0637 \u0627\u0644\u0645\u0637\u0648\u0651\u0644 \u0639\u0644\u0649 \u0627\u0644\u0645\u0642\u0628\u0633 \u064A\u0638\u0647\u0631 \u0641\u064A \u0623\u0639\u0644\u0649 \u0642\u0627\u0626\u0645\u062A\u0647 \u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u062D\u0633\u0628 \u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u062A\u0648\u0635\u064A\u0644 (\u0645\u062B\u0644 \u0625\u0634\u0627\u0631\u0629 AM \u0623\u0648 \u0625\u0634\u0627\u0631\u0629 DSBSC \u0623\u0648 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0627\u0644\u0645\u0633\u062A\u0631\u062C\u0639\u0629)\u060C \u0648\u0645\u0627 \u0627\u0644\u0630\u064A \u062A\u0641\u0639\u0644\u0647 \u0627\u0644\u0648\u062D\u062F\u0629 \u0628\u0645\u062F\u062E\u0644\u0627\u062A\u0647\u0627.</li>
<li><b>\u0627\u0641\u062D\u0635 \u062A\u0648\u0635\u064A\u0644\u064A:</b> \u0641\u064A \u0648\u0631\u0642\u0629 \u0627\u0644\u062A\u062C\u0631\u0628\u0629 \u064A\u0639\u0631\u0636 \u0647\u0630\u0627 \u0627\u0644\u0632\u0631 \u0645\u0627 \u064A\u0646\u0642\u0635\u060C \u0648\u0627\u0644\u0633\u0644\u0643 \u0627\u0644\u0645\u0648\u0635\u0651\u0644 \u0641\u064A \u0645\u0643\u0627\u0646 \u062E\u0637\u0623 \u0623\u0648 \u0627\u0644\u0632\u0627\u0626\u062F\u060C \u0648\u0627\u0644\u0645\u062C\u0633\u0651 \u0639\u0644\u0649 \u0645\u0642\u0628\u0633 \u062E\u0637\u0623\u060C \u0648\u0627\u0644\u0645\u062E\u0631\u062C\u064A\u0646 \u0627\u0644\u0645\u0648\u0635\u0651\u0644\u064A\u0646 \u0645\u0639\u0627\u064B\u060C \u0648\u064A\u064F\u0638\u0647\u0631 \u0627\u0644\u0623\u0633\u0644\u0627\u0643 \u0627\u0644\u062E\u0637\u0623 \u0628\u0627\u0644\u0644\u0648\u0646 \u0627\u0644\u0623\u062D\u0645\u0631 \u0639\u0644\u0649 \u0627\u0644\u062C\u0647\u0627\u0632.</li>
<li><b>\u0645\u0634\u0627\u0631\u0643\u0629 \u0643\u0631\u0627\u0628\u0637</b> (\u0645\u0646 \u0627\u0644\u0625\u0639\u062F\u0627\u062F\u0627\u062A): \u064A\u0635\u0646\u0639 \u0631\u0627\u0628\u0637\u0627\u064B \u0641\u064A\u0647 \u0623\u0633\u0644\u0627\u0643\u0643 \u0648\u0627\u0644\u0645\u0642\u0627\u0628\u0636 \u0648\u0636\u0628\u0637 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629. \u0648\u0645\u0646 \u064A\u0641\u062A\u062D\u0647 \u064A\u062D\u0635\u0644 \u0639\u0644\u0649 \u0646\u0641\u0633 \u0627\u0644\u062A\u0648\u0635\u064A\u0644\u0627\u062A \u0639\u0644\u0649 \u0627\u0644\u0647\u0627\u062A\u0641 \u0623\u0648 \u0627\u0644\u0643\u0645\u0628\u064A\u0648\u062A\u0631. \u0648<b>\u0641\u062A\u062D \u0631\u0627\u0628\u0637 \u0645\u064F\u0634\u0627\u0631\u064E\u0643</b> \u064A\u0641\u062A\u062D \u0631\u0627\u0628\u0637\u0627\u064B \u0645\u0646\u0633\u0648\u062E\u0627\u064B \u0645\u0646 \u0645\u0643\u0627\u0646 \u0622\u062E\u0631.</li>
<li><b>\u0645\u0644\u0621 \u0627\u0644\u0634\u0627\u0634\u0629:</b> \u0639\u0644\u0649 \u0623\u0646\u062F\u0631\u0648\u064A\u062F \u062A\u0645\u0644\u0623 \u0627\u0644\u0635\u0641\u062D\u0629 \u0627\u0644\u0634\u0627\u0634\u0629 (\u0628\u062F\u0648\u0646 \u0634\u0631\u064A\u0637 \u0627\u0644\u0639\u0646\u0648\u0627\u0646) \u0628\u0639\u062F \u0623\u0648\u0644 \u0636\u063A\u0637\u0629\u060C \u0648\u0644\u0644\u062E\u0631\u0648\u062C \u0627\u0633\u062D\u0628 \u0645\u0646 \u062D\u0627\u0641\u0629 \u0627\u0644\u0634\u0627\u0634\u0629 \u0648\u0627\u0636\u063A\u0637 \u0631\u062C\u0648\u0639\u060C \u0648\u0632\u0631 \u0645\u0644\u0621 \u0627\u0644\u0634\u0627\u0634\u0629 \u0641\u064A \u0634\u0631\u064A\u0637 \u0627\u0644\u0623\u062F\u0648\u0627\u062A \u064A\u0639\u064A\u062F\u0647. \u0648\u0645\u0646 \u0627\u0644\u0625\u0639\u062F\u0627\u062F\u0627\u062A \u2190 \u0645\u0644\u0621 \u0627\u0644\u0634\u0627\u0634\u0629 \u062A\u0634\u063A\u0651\u0644\u0647 \u0623\u0648 \u062A\u0648\u0642\u0641\u0647. \u0648\u0639\u0644\u0649 \u0622\u064A\u0641\u0648\u0646 \u0623\u0636\u0650\u0641\u0647 \u0625\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629 \u0648\u0627\u0641\u062A\u062D\u0647 \u0645\u0646 \u0647\u0646\u0627\u0643.</li>
<li><b>\u0623\u0636\u0650\u0641\u0647 \u0625\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629</b> \u0644\u062A\u0641\u062A\u062D\u0647 \u0643\u062A\u0637\u0628\u064A\u0642 \u0648\u062A\u0633\u062A\u062E\u062F\u0645\u0647 \u0645\u0646 \u063A\u064A\u0631 \u0625\u0646\u062A\u0631\u0646\u062A: \u0641\u064A Chrome \u0645\u0646 \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u062B\u0645 \xAB\u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629\xBB\u060C \u0648\u0641\u064A \u0622\u064A\u0641\u0648\u0646 \u0645\u0646 \u0632\u0631 \u0627\u0644\u0645\u0634\u0627\u0631\u0643\u0629 \u062B\u0645 \xAB\u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629\xBB.</li></ul>`,scope:`<h3>\u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 (\u0639\u0644\u0649 \u0646\u0645\u0637 UTD2102CEL)</h3><ul>
<li><b>\u0627\u0644\u062A\u0648\u0635\u064A\u0644:</b> \u0627\u0633\u062D\u0628 \u0645\u0646 \u0645\u0642\u0628\u0633 BNC (CH1 \u0623\u0648 CH2 \u0623\u0648 EXT TRIG) \u0625\u0644\u0649 \u0623\u064A \u0645\u0642\u0628\u0633 \u0639\u0644\u0649 \u0627\u0644\u062C\u0647\u0627\u0632. \u0627\u0646\u0642\u0631 \u0639\u0644\u0649 \u0627\u0644\u0633\u0644\u0643 \u0645\u0631\u062A\u064A\u0646 \u0644\u0625\u0632\u0627\u0644\u062A\u0647.</li>
<li><b>CH1 / CH2:</b> \u0627\u0644\u0636\u063A\u0637\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 \u062A\u062E\u062A\u0627\u0631 \u0627\u0644\u0642\u0646\u0627\u0629 \u0648\u062A\u0641\u062A\u062D \u0642\u0627\u0626\u0645\u062A\u0647\u0627\u060C \u062B\u0645 \u062A\u062A\u062D\u0643\u0645 \u0641\u064A\u0647\u0627 \u0645\u0642\u0627\u0628\u0636 VERTICAL \u0627\u0644\u0645\u0634\u062A\u0631\u0643\u0629. \u0648\u0625\u0630\u0627 \u0643\u0627\u0646\u062A \u0642\u0627\u0626\u0645\u062A\u0647\u0627 \u0645\u0641\u062A\u0648\u062D\u0629\u060C \u0641\u0627\u0644\u0636\u063A\u0637\u0629 \u062A\u0648\u0642\u0641 \u0627\u0644\u0642\u0646\u0627\u0629.</li>
<li><b>VERTICAL:</b> \u0627\u0644\u0645\u0642\u0628\u0636 SCALE \u064A\u062D\u062F\u062F \u0627\u0644\u0641\u0648\u0644\u062A \u0644\u0643\u0644 \u0645\u0631\u0628\u0639 (Volts/div)\u060C \u0648 POSITION \u064A\u062D\u0631\u0651\u0643 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0631\u0623\u0633\u064A\u0627\u064B.</li>
<li><b>HORIZONTAL:</b> \u0627\u0644\u0645\u0642\u0628\u0636 SCALE \u064A\u062D\u062F\u062F \u0627\u0644\u0632\u0645\u0646 \u0644\u0643\u0644 \u0645\u0631\u0628\u0639 (Time/div)\u060C \u0648\u0627\u0644\u0634\u0627\u0634\u0629 12 \xD7 8 \u0645\u0631\u0628\u0639\u0627\u062A\u060C \u0648 POSITION \u064A\u062D\u0631\u0651\u0643 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0623\u0641\u0642\u064A\u0627\u064B. \u0648\u0641\u064A <b>HORI MENU</b> \u064A\u0648\u062C\u062F Main \u0648 Window (\u062A\u0646\u0642\u0633\u0645 \u0627\u0644\u0634\u0627\u0634\u0629: \u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0627\u0644\u0632\u0645\u0646\u064A\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629 \u0641\u064A \u0627\u0644\u0623\u0639\u0644\u0649 \u0645\u0639 \u062A\u062D\u062F\u064A\u062F \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0645\u0643\u0628\u064E\u0651\u0631\u060C \u0648\u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0627\u0644\u0645\u0643\u0628\u064E\u0651\u0631\u0629 \u0641\u064A \u0627\u0644\u0623\u0633\u0641\u0644) \u0648 Hold off (\u064A\u064F\u0636\u0628\u0637 \u0628\u0627\u0644\u0645\u0642\u0628\u0636 MULTI PURPOSE).</li>
<li><b>TRIGGER:</b> \u0627\u0644\u0645\u0642\u0628\u0636 LEVEL \u064A\u062D\u062F\u062F \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0632\u0646\u0627\u062F. \u0648\u0641\u064A <b>TRIG MENU</b> \u062A\u062E\u062A\u0627\u0631 \u0627\u0644\u0645\u0635\u062F\u0631 (CH1 \u0623\u0648 CH2 \u0623\u0648 EXT \u0623\u0648 AC Line) \u0648\u0627\u0644\u0645\u064A\u0644 (Rise \u0623\u0648 Fall \u0623\u0648 Rise &amp; Fall) \u0648\u0627\u0644\u0648\u0636\u0639 Auto/Normal/Single \u0648\u0627\u0644\u0627\u0642\u062A\u0631\u0627\u0646. \u0648\u0627\u0644\u0632\u0631 <b>FORCE</b> \u064A\u064F\u062D\u062F\u062B \u0632\u0646\u0627\u062F\u0627\u064B \u0648\u0627\u062D\u062F\u0627\u064B.</li>
<li><b>SET TO ZERO:</b> \u064A\u0639\u064A\u062F \u0627\u0644\u0645\u0648\u0636\u0639 \u0627\u0644\u0631\u0623\u0633\u064A \u0648\u0627\u0644\u0623\u0641\u0642\u064A \u0648 Hold off \u0625\u0644\u0649 \u0627\u0644\u0635\u0641\u0631\u060C \u0648\u064A\u0636\u0628\u0637 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0632\u0646\u0627\u062F \u0639\u0644\u0649 50%.</li>
<li><b>MEASURE:</b> \u0623\u0631\u0628\u0639 \u0645\u0646\u0627\u0637\u0642 (F1 \u0625\u0644\u0649 F4)\u061B \u0627\u0636\u063A\u0637 \u0639\u0644\u0649 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0644\u062A\u062E\u062A\u0627\u0631 \u0627\u0644\u0642\u0646\u0627\u0629 \u0648\u0627\u0644\u0646\u0648\u0639 (Volt \u0623\u0648 Time) \u0648\u0627\u0644\u0645\u0639\u0627\u0645\u0644 (Pk-Pk \u0648 RMS \u0648 Freq \u0648 Period \u0648\u063A\u064A\u0631\u0647\u0627). \u0648\u0627\u0644\u0632\u0631 F5 \u064A\u0639\u0631\u0636 \u0643\u0644 \u0627\u0644\u0645\u0639\u0627\u0645\u0644\u0627\u062A \u0644\u0642\u0646\u0627\u0629 \u0648\u0627\u062D\u062F\u0629.</li>
<li><b>CURSOR</b> \u0645\u0624\u0634\u0631\u0627\u062A \u0644\u0644\u062C\u0647\u062F \u0623\u0648 \u0627\u0644\u0632\u0645\u0646 \u0623\u0648 \u0627\u0644\u062A\u062A\u0628\u0651\u0639 (Tracking) \u062A\u064F\u062D\u0631\u064E\u0651\u0643 \u0628\u0627\u0644\u0645\u0642\u0628\u0636 MULTI PURPOSE (\u0627\u0636\u063A\u0637 \u0627\u0644\u0645\u0642\u0628\u0636 \u0644\u0644\u062A\u0628\u062F\u064A\u0644 \u0628\u064A\u0646 A \u0648 B \u0648 A &amp; B). \u0648<b>MATH</b> \u0641\u064A\u0647 + \u0648 \u2212 \u0648 \xD7 \u0648 \xF7 \u0648 FFT\u060C \u0648<b>AUTO</b> \u0636\u0628\u0637 \u062A\u0644\u0642\u0627\u0626\u064A\u060C \u0648<b>RUN/STOP</b> \u064A\u0648\u0642\u0641 \u0627\u0644\u0627\u0644\u062A\u0642\u0627\u0637\u060C \u0648<b>PrtSc</b> \u064A\u062D\u0641\u0638 \u0635\u0648\u0631\u0629 \u0627\u0644\u0634\u0627\u0634\u0629.</li>
<li><b>UTILITY</b> (\u062B\u0644\u0627\u062B \u0635\u0641\u062D\u0627\u062A): Self Cal \u0648 Help \u0648 Reset \u0648 Grid \u0648\u0639\u062F\u0651\u0627\u062F \u0627\u0644\u062A\u0631\u062F\u062F (Cymometer).</li></ul>

  </svg>`},Ct=[{art:"welcome",title:Z("Welcome to the Telecoms-Trainer 101 simulator","\u0645\u0631\u062D\u0628\u0627\u064B \u0628\u0643 \u0641\u064A \u0645\u062D\u0627\u0643\u064A Telecoms-Trainer 101"),text:Z("On the left is the Emona ETT-101 kit, on the right a UTD2102CEL-style oscilloscope. Wire the kit, turn the knobs and watch the signals, as in the lab. This short guide shows you around.","\u0639\u0644\u0649 \u0627\u0644\u064A\u0633\u0627\u0631 \u062C\u0647\u0627\u0632 Emona ETT-101\u060C \u0648\u0639\u0644\u0649 \u0627\u0644\u064A\u0645\u064A\u0646 \u0631\u0627\u0633\u0645 \u0625\u0634\u0627\u0631\u0629 \u0639\u0644\u0649 \u0646\u0645\u0637 UTD2102CEL. \u0635\u0650\u0644 \u0627\u0644\u0623\u0633\u0644\u0627\u0643 \u0648\u0623\u062F\u0650\u0631 \u0627\u0644\u0645\u0642\u0627\u0628\u0636 \u0648\u0634\u0627\u0647\u062F \u0627\u0644\u0625\u0634\u0627\u0631\u0627\u062A \u0643\u0645\u0627 \u0641\u064A \u0627\u0644\u0645\u0639\u0645\u0644. \u0647\u0630\u0627 \u0627\u0644\u062F\u0644\u064A\u0644 \u0627\u0644\u0642\u0635\u064A\u0631 \u064A\u0639\u0631\u0651\u0641\u0643 \u0628\u0627\u0644\u0628\u0631\u0646\u0627\u0645\u062C.")},{target:"#board",view:"kit",art:"drag",title:Z("Wire the kit","\u062A\u0648\u0635\u064A\u0644 \u0627\u0644\u0623\u0633\u0644\u0627\u0643"),touch:{text:Z("Drag from one socket to another to plug in a lead, or hold a socket and choose Lead to another socket, then tap the other one. Tap a lead twice to remove it; hold it for its menu. Turn a knob by dragging around it.","\u0627\u0633\u062D\u0628 \u0645\u0646 \u0645\u0642\u0628\u0633 \u0625\u0644\u0649 \u0645\u0642\u0628\u0633 \u0622\u062E\u0631 \u0644\u062A\u0648\u0635\u064A\u0644 \u0633\u0644\u0643\u060C \u0623\u0648 \u0627\u0636\u063A\u0637 \u0645\u0637\u0648\u0651\u0644\u0627\u064B \u0639\u0644\u0649 \u0645\u0642\u0628\u0633 \u0648\u0627\u062E\u062A\u0631 \xAB\u0633\u0644\u0643 \u0625\u0644\u0649 \u0645\u0642\u0628\u0633 \u0622\u062E\u0631\xBB \u062B\u0645 \u0627\u0636\u063A\u0637 \u0639\u0644\u0649 \u0627\u0644\u0645\u0642\u0628\u0633 \u0627\u0644\u0622\u062E\u0631. \u0627\u0636\u063A\u0637 \u0639\u0644\u0649 \u0627\u0644\u0633\u0644\u0643 \u0645\u0631\u062A\u064A\u0646 \u0644\u0625\u0632\u0627\u0644\u062A\u0647\u060C \u0648\u0645\u0637\u0648\u0651\u0644\u0627\u064B \u0644\u0642\u0627\u0626\u0645\u062A\u0647. \u0623\u062F\u0650\u0631 \u0627\u0644\u0645\u0642\u0628\u0636 \u0628\u0627\u0644\u0633\u062D\u0628 \u062D\u0648\u0644\u0647.")},text:Z("Drag from one socket to another to plug in a lead. Double-click a lead to remove it, right-click it to change its colour. Turn a knob by dragging around it or with the mouse wheel.","\u0627\u0633\u062D\u0628 \u0645\u0646 \u0645\u0642\u0628\u0633 \u0625\u0644\u0649 \u0645\u0642\u0628\u0633 \u0622\u062E\u0631 \u0644\u062A\u0648\u0635\u064A\u0644 \u0633\u0644\u0643. \u0627\u0646\u0642\u0631 \u0639\u0644\u0649 \u0627\u0644\u0633\u0644\u0643 \u0645\u0631\u062A\u064A\u0646 \u0644\u0625\u0632\u0627\u0644\u062A\u0647\u060C \u0648\u0627\u0646\u0642\u0631 \u0628\u0627\u0644\u0632\u0631 \u0627\u0644\u0623\u064A\u0645\u0646 \u0644\u062A\u063A\u064A\u064A\u0631 \u0644\u0648\u0646\u0647. \u0623\u062F\u0650\u0631 \u0627\u0644\u0645\u0642\u0628\u0636 \u0628\u0627\u0644\u0633\u062D\u0628 \u062D\u0648\u0644\u0647 \u0623\u0648 \u0628\u0639\u062C\u0644\u0629 \u0627\u0644\u0641\u0623\u0631\u0629.")},{target:"#scope",view:"scope",art:"probe",title:Z("The oscilloscope","\u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629"),touch:{text:Z("Easiest on a phone: hold any socket on the kit for a moment and choose Connect to CH1 or CH2. You can also drag from the CH1 or CH2 socket. The keys and knobs work like the real scope; AUTO sets everything up.","\u0627\u0644\u0623\u0633\u0647\u0644 \u0639\u0644\u0649 \u0627\u0644\u0647\u0627\u062A\u0641: \u0627\u0636\u063A\u0637 \u0645\u0637\u0648\u0651\u0644\u0627\u064B \u0639\u0644\u0649 \u0623\u064A \u0645\u0642\u0628\u0633 \u0641\u064A \u0627\u0644\u062C\u0647\u0627\u0632 \u0648\u0627\u062E\u062A\u0631 \xAB\u062A\u0648\u0635\u064A\u0644 \u0628\u0640 CH1\xBB \u0623\u0648 CH2. \u0648\u064A\u0645\u0643\u0646\u0643 \u0623\u064A\u0636\u0627\u064B \u0627\u0644\u0633\u062D\u0628 \u0645\u0646 \u0645\u0642\u0628\u0633 CH1 \u0623\u0648 CH2. \u0627\u0644\u0623\u0632\u0631\u0627\u0631 \u0648\u0627\u0644\u0645\u0642\u0627\u0628\u0636 \u062A\u0639\u0645\u0644 \u0645\u062B\u0644 \u0627\u0644\u062C\u0647\u0627\u0632 \u0627\u0644\u062D\u0642\u064A\u0642\u064A\u060C \u0648\u0627\u0644\u0632\u0631 AUTO \u064A\u0636\u0628\u0637 \u0643\u0644 \u0634\u064A\u0621.")},text:Z("Drag from the CH1 or CH2 socket to any socket on the kit to see that signal. The keys and knobs work like the real scope; AUTO sets everything up for you.","\u0627\u0633\u062D\u0628 \u0645\u0646 \u0645\u0642\u0628\u0633 CH1 \u0623\u0648 CH2 \u0625\u0644\u0649 \u0623\u064A \u0645\u0642\u0628\u0633 \u0639\u0644\u0649 \u0627\u0644\u062C\u0647\u0627\u0632 \u0644\u062A\u0631\u0649 \u0625\u0634\u0627\u0631\u062A\u0647. \u0627\u0644\u0623\u0632\u0631\u0627\u0631 \u0648\u0627\u0644\u0645\u0642\u0627\u0628\u0636 \u062A\u0639\u0645\u0644 \u0645\u062B\u0644 \u0627\u0644\u062C\u0647\u0627\u0632 \u0627\u0644\u062D\u0642\u064A\u0642\u064A\u060C \u0648\u0627\u0644\u0632\u0631 AUTO \u064A\u0636\u0628\u0637 \u0643\u0644 \u0634\u064A\u0621 \u062A\u0644\u0642\u0627\u0626\u064A\u0627\u064B.")},{art:"zoom",title:Z("Zoom in and out","\u0627\u0644\u062A\u0643\u0628\u064A\u0631 \u0648\u0627\u0644\u062A\u0635\u063A\u064A\u0631"),touch:{art:"pinch",text:Z("Pinch with two fingers to zoom in or out, right where your fingers are. Drag an empty part of the bench with one finger to move around.","\u0628\u0627\u0639\u0650\u062F \u0628\u064A\u0646 \u0625\u0635\u0628\u0639\u064A\u0646 \u0623\u0648 \u0642\u0631\u0651\u0628\u0647\u0645\u0627 \u0644\u0644\u062A\u0643\u0628\u064A\u0631 \u0648\u0627\u0644\u062A\u0635\u063A\u064A\u0631 \u0639\u0646\u062F \u0645\u0643\u0627\u0646 \u0623\u0635\u0627\u0628\u0639\u0643 \u062A\u0645\u0627\u0645\u0627\u064B. \u0648\u0627\u0633\u062D\u0628 \u0628\u0625\u0635\u0628\u0639 \u0648\u0627\u062D\u062F\u0629 \u0641\u064A \u0645\u0643\u0627\u0646 \u0641\u0627\u0631\u063A \u0644\u062A\u062A\u062D\u0631\u0643 \u0641\u064A \u0627\u0644\u0645\u0633\u0627\u062D\u0629.")},text:Z("Hold Ctrl and turn the mouse wheel: up zooms in, down zooms out, right where the pointer is. Drag an empty part of the bench to move around.","\u0627\u0636\u063A\u0637 Ctrl \u0645\u0639 \u062A\u062F\u0648\u064A\u0631 \u0639\u062C\u0644\u0629 \u0627\u0644\u0641\u0623\u0631\u0629: \u0644\u0644\u0623\u0639\u0644\u0649 \u0644\u0644\u062A\u0643\u0628\u064A\u0631\u060C \u0648\u0644\u0644\u0623\u0633\u0641\u0644 \u0644\u0644\u062A\u0635\u063A\u064A\u0631\u060C \u0639\u0646\u062F \u0645\u0643\u0627\u0646 \u0627\u0644\u0645\u0624\u0634\u0631 \u062A\u0645\u0627\u0645\u0627\u064B. \u0648\u0627\u0633\u062D\u0628 \u0641\u064A \u0645\u0643\u0627\u0646 \u0641\u0627\u0631\u063A \u0644\u062A\u062A\u062D\u0631\u0643 \u0641\u064A \u0627\u0644\u0645\u0633\u0627\u062D\u0629.")},{target:"#btnFull",title:Z("Back to the middle","\u0627\u0644\u0639\u0648\u062F\u0629 \u0625\u0644\u0649 \u0627\u0644\u0645\u0646\u062A\u0635\u0641"),text:Z("Lost after zooming? This button brings the kit and the scope back to the middle of the screen.","\u0647\u0644 \u0627\u0628\u062A\u0639\u062F\u062A \u0628\u0639\u062F \u0627\u0644\u062A\u0643\u0628\u064A\u0631\u061F \u0647\u0630\u0627 \u0627\u0644\u0632\u0631 \u064A\u0639\u064A\u062F \u0627\u0644\u062C\u0647\u0627\u0632 \u0648\u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0625\u0644\u0649 \u0645\u0646\u062A\u0635\u0641 \u0627\u0644\u0634\u0627\u0634\u0629.")},{target:".tray",title:Z("Kit, Both or Scope","\u0627\u0644\u062C\u0647\u0627\u0632 \u0623\u0648 \u0643\u0644\u0627\u0647\u0645\u0627 \u0623\u0648 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629"),text:Z("Show the kit, both, or only the scope. The keys 1, 2 and 3 do the same.","\u0627\u0639\u0631\u0636 \u0627\u0644\u062C\u0647\u0627\u0632 \u0623\u0648 \u0643\u0644\u064A\u0647\u0645\u0627 \u0623\u0648 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0641\u0642\u0637. \u0648\u0627\u0644\u0645\u0641\u0627\u062A\u064A\u062D 1 \u0648 2 \u0648 3 \u062A\u0641\u0639\u0644 \u0627\u0644\u0634\u064A\u0621 \u0646\u0641\u0633\u0647."),touch:{text:Z("Show the kit, both, or only the scope: on a phone the Kit and Scope views are the easiest to use.","\u0627\u0639\u0631\u0636 \u0627\u0644\u062C\u0647\u0627\u0632 \u0623\u0648 \u0643\u0644\u064A\u0647\u0645\u0627 \u0623\u0648 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0641\u0642\u0637. \u0639\u0644\u0649 \u0627\u0644\u0647\u0627\u062A\u0641 \u064A\u0643\u0648\u0646 \u0639\u0631\u0636 \u0627\u0644\u062C\u0647\u0627\u0632 \u0648\u062D\u062F\u0647 \u0623\u0648 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0648\u062D\u062F\u0647 \u0627\u0644\u0623\u0633\u0647\u0644 \u0641\u064A \u0627\u0644\u0627\u0633\u062A\u062E\u062F\u0627\u0645.")}},{target:"#btnLib",title:Z("Ready-made experiments","\u062A\u062C\u0627\u0631\u0628 \u062C\u0627\u0647\u0632\u0629"),text:Z("Every experiment of the lab books, with its page number. One click wires the kit and sets the scope.","\u0643\u0644 \u062A\u062C\u0627\u0631\u0628 \u0643\u062A\u0628 \u0627\u0644\u0645\u0639\u0645\u0644 \u0645\u0639 \u0631\u0642\u0645 \u0627\u0644\u0635\u0641\u062D\u0629. \u0628\u0646\u0642\u0631\u0629 \u0648\u0627\u062D\u062F\u0629 \u062A\u064F\u0648\u0635\u064E\u0651\u0644 \u0627\u0644\u0623\u0633\u0644\u0627\u0643 \u0648\u064A\u064F\u0636\u0628\u0637 \u0631\u0627\u0633\u0645 \u0627\u0644\u0625\u0634\u0627\u0631\u0629.")},{target:"#btnGuide",title:Z("Lab sheets","\u0623\u0648\u0631\u0627\u0642 \u0627\u0644\u062A\u062C\u0627\u0631\u0628"),text:Z("Step-by-step sheets that follow the book. Each step ticks off the connections as you make them.","\u0623\u0648\u0631\u0627\u0642 \u062E\u0637\u0648\u0629 \u0628\u062E\u0637\u0648\u0629 \u062A\u062A\u0628\u0639 \u0627\u0644\u0643\u062A\u0627\u0628. \u0648\u062A\u064F\u0639\u0644\u064E\u0651\u0645 \u0627\u0644\u062A\u0648\u0635\u064A\u0644\u0627\u062A \u0641\u064A \u0643\u0644 \u062E\u0637\u0648\u0629 \u0639\u0646\u062F\u0645\u0627 \u062A\u0646\u0641\u0651\u0630\u0647\u0627.")},{target:"#tGuide",title:Z("Guidance","\u0627\u0644\u0625\u0631\u0634\u0627\u062F\u0627\u062A"),text:Z("Shows the i buttons, socket names with live readings and knob values. Turn it off to practise like the lab exam.","\u062A\u064F\u0638\u0647\u0631 \u0623\u0632\u0631\u0627\u0631 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062A \u0648\u0623\u0633\u0645\u0627\u0621 \u0627\u0644\u0645\u0642\u0627\u0628\u0633 \u0645\u0639 \u0642\u0631\u0627\u0621\u0627\u062A\u0647\u0627 \u0648\u0642\u064A\u0645 \u0627\u0644\u0645\u0642\u0627\u0628\u0636. \u0623\u0648\u0642\u0641\u0647\u0627 \u0644\u062A\u062A\u062F\u0631\u0651\u0628 \u0643\u0645\u0627 \u0641\u064A \u0627\u0645\u062A\u062D\u0627\u0646 \u0627\u0644\u0645\u0639\u0645\u0644.")},{target:"#btnBug",title:Z("Problems and suggestions","\u0627\u0644\u0645\u0634\u0643\u0644\u0627\u062A \u0648\u0627\u0644\u0627\u0642\u062A\u0631\u0627\u062D\u0627\u062A"),text:Z("Found something wrong, or have an idea for a new feature? Send it to the developer on WhatsApp from here.","\u0647\u0644 \u0648\u062C\u062F\u062A \u062E\u0637\u0623\u064B \u0623\u0648 \u0644\u062F\u064A\u0643 \u0641\u0643\u0631\u0629 \u0644\u0645\u064A\u0632\u0629 \u062C\u062F\u064A\u062F\u0629\u061F \u0623\u0631\u0633\u0644\u0647\u0627 \u0625\u0644\u0649 \u0627\u0644\u0645\u0637\u0648\u0651\u0631 \u0639\u0628\u0631 \u0648\u0627\u062A\u0633\u0627\u0628 \u0645\u0646 \u0647\u0646\u0627.")},{target:"#btnSettings",title:Z("Settings","\u0627\u0644\u0625\u0639\u062F\u0627\u062F\u0627\u062A"),text:Z("Language, sound, saving and opening your wiring, help, and this guide if you want to see it again.","\u0627\u0644\u0644\u063A\u0629 \u0648\u0627\u0644\u0635\u > Preliminary (beta) version: the model follows the sources below but may not match the real kit 100%. Free and non-commercial, made only to help students; it must not be sold or used to make money in any way.

Sources, in order of precedence:
1. **ETT-101 BiSKIT Specifications V1.1** (Emona, emona-tims.com) \u2014 the product's own spec table.
2. **ETT-101 User Manual** (Emona sample, tecnoedu.com / emona-tims.com).
3. **The course lab books**: Electrical Testing (6), ELC414 (Term 1: AM, DSBSC, AM and DSBSC demodulation, SSB, FM, FM demodulation) and Electrical Testing (7), ELC424 (Term 2: Emona Vol.1 Exp. 11\u201319 + Vol.2: sampling, PCM, ASK, FSK, BPSK, QPSK, DSSS, PWM, PLL, SNR, delta and delta-sigma) \u2014 procedures, scope settings and expected results.
4. **Emona ETT-202 DATEx specifications** (NI, archived) \u2014 same module family as the ETT-101; numbers identical to Spec 1.1 for every shared module.
5. **Emona DATEx lab manual sample** (NI, download.ni.com) and the DATEx user manual \u2014 used only where 1\u20133 are silent.
6. **TIMS-301 user manual** (Emona, NJIT copy) \u2014 the parent product; used only to confirm the VCO's "G\xB7Vin, 1 < G < 2" control.

### Where the official sources disagree (and what the model uses)
| Item | Sources | Model |
|---|---|---|
| Tuneable LPF range | Spec 1.1: 600 Hz\u201312 kHz. User manual text: 300 Hz\u201316 kHz. Lab manuals: "maximum cut-off about 15 kHz" (ET7 Vol.2 Exp.17 step 31 and Exp.18 step 28; DATEx Vol.2 Exp.14 "fully clockwise gives 15 kHz") | **300 Hz\u201315 kHz** |
| Tuneable LPF gain | Spec 1.1: 0\u20131.6. User manual: 0\u2013\xD72 | 0\u20132 |
| Buffer gain | Spec 1.1 ("Amplifier"): 0.2\u201310. User manual: 0\u201310 | 0\u201310 (audio taper) |
| Adder / Buffer bandwidth | Spec 1.1: \u2248600 kHz. User manual: \u22481 MHz / \u2248700 kHz | 600 kHz |
| Speech output | Spec 1.1: 0.6 Vrms typ. User manual: 2 Vrms typ. | depends on the PC microphone |
| VCO HI low end | Spec 1.1: 60 kHz. ET7 Vol.2 Exp.2 step 38: \u224850 kHz | 60 kHz |

Not modelled (documented but not numerically pinned down): input loading. Inputs are 10 k\u03A9 or 56 k\u03A9 (which input has which is not published), outputs 330 \u03A9 analog / 47 \u03A9 digital, so a real reading can be 0.6\u20133 % lower than ideal. The DATEx lab manual says real measurements fall short of the ideal values "because of loading and imperfect gains".

Simulation: 4.8 MHz (100 kHz carrier = 48 samples/cycle; all Master Signals synchronous). Audio-band filters run at 600 kHz with decimation/interpolation (identical passband response).

## Still to confirm on the real kit
1. Multiplier k: 2kHz SINE \u2192 Y AC, 100kHz SINE \u2192 X AC, measure kXY. 8 Vp-p means k = 1 (current model), 4 Vp-p means k = 0.5.
2. VCO sensitivity on LO with GAIN fully anticlockwise and fully clockwise (kHz per volt) \u2014 gives K0 directly.
3. Tuneable LPF fc\xD7100 output with the knob fully anticlockwise and fully clockwise \u2014 settles 300/600 Hz and 12/15 kHz.
4. VCO HI range low end: spec says 60 kHz, ET7 Exp.2 step 38 says ~50 kHz fully anticlockwise (model uses the spec).

## Verification (tools/verify_book.mjs, tools/verify_more.mjs) \u2014 all pass
- Exp 1: ADDER out 1.000 V DC + 1.000 Vp-p; envelope correlates 0.999 with CH1; P 5.92, Q 1.97, m = 0.500; G max \u2192 over-modulation.
- Exp 2: DSBSC 7.9 Vp-p; envelope = |message|; BUFFER \xBC \u2192 no overload, just past \xBD \u2192 clipping.
- Exp 3: recovered message correlates 0.997 with the message, 53 \xB5s delay.
- Exp 4: product detector output correlates 1.000 with the message; VCO HI middle = 100 kHz.
- Exp 5: flat envelope at 270\xB0, single sinewave 97.917 kHz; recovered message correlates 1.000.
- Exp 6: 2 kHz DIGITAL shifts the VCO between two frequencies.
- Exp 7: GAIN trimmed gives 15.00 / 5.00 kHz at \xB12 V; BASEBAND LPF DC 0.272 / 0.544 / 0.816 V; Part D output correlates 0.996 with the message.

## Second-semester checks (tools/verify_vol2.mjs) \u2014 all pass
- Sampling: natural sampling = message while 8 kHz is high; S&H steps at 8.33 kHz; TLPF reconstructs (corr 1.000).
- PCM encoder: 0 V \u2192 10000000, MSB first, FS during bit 0; 00000001 from \u22121.992 V, 11111111 from +1.996 V (15.6 mV steps).
- ASK: 0 V at logic 0. BPSK: LINE CODE NRZ-L \xB12 V, product detector corr 0.990.
- QPSK: X1/X2 \xB12 V; Divider left-up/right-down = \xF72.
- PWM: TWIN PULSE Q2 \u2192 DIODE & RC LPF = 8 kHz sawtooth, 4.0 V peak, fast rise / slow decay.
- FSK (Exp.16): Part A tones 4.20 / 16.72 kHz; Part B (FREQ at 2 o'clock, fc fully clockwise) tones 12.18 / 24.74 kHz, the filter passes the logic-0 tone and leaves 2.5 % of the logic-1 tone (elliptic ringing after each edge) \u2192 ASK-like output, Figure 6.
- Comparator output rise time 625 ns at this sample rate (spec 500 ns).

## Engine
- Scope FFT uses integer decimation (a fractional step put spurs about 35 dB down across the span).
- All biquad filters use direct form I, so turning the TUNEABLE LPF knob changes the filter without a burst (DF-II state reached the rails when fc was swept down).
- Feedback loops (delta, delta-sigma, PLL) are evaluated in 8-sample sub-blocks (1.7 \xB5s loop delay); a loop broken at the 256-sample block (53 \xB5s) latched the delta modulator.

## Setup files (tools/make_setups.mjs, checked by tools/check_setups.mjs) \u2014 68 files, all pass
