# Builds the Windows installer and the Mac app, and publishes them as a GitHub Release.
# The installed apps check this repo's latest release and update themselves.
#
# Ways to release a new version:
#   1) Change "version" in package.json (e.g. 0.26.0 -> 0.27.0) and push to main.
#      A release starts automatically when that version has not been released yet.
#   2) Actions tab -> "Release" -> "Run workflow" -> type the new version.
#   3) Push a tag:  git tag v0.27.0 && git push origin v0.27.0
# Downloads of build tools come from GitHub Releases; if GitHub is having an outage, re-run later.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "New version number, e.g. 0.27.0 (must be higher than the last one)"
        required: true
      notes:
        description: "What changed (optional, shown on the release page)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Work out the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="$INPUT_VERSION"
          elif [ "${{ github.ref_type }}" = "tag" ]; then V="${GITHUB_REF_NAME}"
          else V="$(node -p "require('./package.json').version")"; fi
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must look like 1.2.3 (got '$V')"; exit 1; }
          SKIP=false
          if gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "::notice::v$V is already released; nothing to do."; SKIP=true
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "tag=v$V" >> "$GITHUB_OUTPUT"; echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Create a draft release (hidden from the apps until both builds are uploaded)
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          T="${{ steps.v.outputs.tag }}"
          if gh release view "$T" >/dev/null 2>&1; then echo "Draft $T already exists"; exit 0; fi
          gh release create "$T" --draft --target "${{ github.sha }}" --title "ETT-101 Simulator $T" --notes "${NOTES:-Version ${{ steps.v.outputs.version }}}"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Cache the Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eb-${{ runner.os }}-
      - name: Install
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # electron-builder downloads the Electron it packages by itself
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "::warning::npm ci attempt $i failed; retrying in 30 s"; sleep 30; done
          exit 1
      - name: Set the version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Build the simulator page
        run: node build.mjs
      - name: Build and upload the app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # electron-builder downloads its tools (NSIS, etc.) from GitHub; retry if a download times out
          for i in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish always && exit 0
            echo "::warning::Build attempt $i failed; retrying in 30 s"; sleep 30
          done
          exit 1

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Attach the experiment setup files and the model reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd setups && zip -qr ../ETT101-Experiments-Setups.zip .)
          cp SPEC.md ETT101-Model-Reference.md
          gh release upload "${{ needs.prepare.outputs.tag }}" ETT101-Experiments-Setups.zip ETT101-Model-Reference.md --clobber
      - name: Publish the release (the apps will now see the update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
